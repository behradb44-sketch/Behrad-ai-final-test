<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#06101c"
    >

    <title>BEHRAD AI</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    <!-- Markdown -->
    <script
        src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"
    ></script>

    <!-- Security -->
    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"
    ></script>

    <!-- Charts -->
    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"
    ></script>

</head>


<body>

<div class="app">


    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-icon">
                    B
                </div>

                <span>
                    BEHRAD AI
                </span>

            </div>

            <button
                id="closeSidebar"
                class="icon-button mobile-only"
            >
                ×
            </button>

        </div>


        <button
            id="newChatButton"
            class="new-chat"
        >

            <span>
                ＋
            </span>

            چت جدید

        </button>


        <div
            id="chatList"
            class="chat-list"
        >
        </div>


        <div class="sidebar-footer">

            چت‌ها روی همین مرورگر ذخیره می‌شوند.

        </div>

    </aside>


    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <button
                id="menuButton"
                class="icon-button"
            >
                ☰
            </button>


            <div class="topbar-title">

                BEHRAD AI

            </div>


            <button
                id="topNewChat"
                class="icon-button"
            >
                ＋
            </button>

        </header>


        <!-- ========================= -->
        <!-- CHAT -->
        <!-- ========================= -->

        <section
            id="chat"
            class="chat"
        >

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-icon">
                    B
                </div>

                <h1>
                    چه کاری می‌تونم برات انجام بدم؟
                </h1>


                <div class="suggestions">

                    <button
                        data-prompt="جدیدترین قیمت RX 9070 را در وب پیدا کن و منابع را هم نشان بده."
                    >

                        <span>🔎</span>

                        جستجوی وب

                    </button>


                    <button
                        data-prompt="یک گربه فضانورد روی ماه بساز."
                    >

                        <span>🖼️</span>

                        ساخت تصویر

                    </button>


                    <button
                        data-prompt="برای اعداد 10، 20، 15، 30 یک نمودار بساز."
                    >

                        <span>📊</span>

                        نمودار

                    </button>


                    <button
                        data-prompt="یک جدول مقایسه‌ای برای چند کارت گرافیک بساز."
                    >

                        <span>📋</span>

                        جدول

                    </button>

                </div>

            </div>

        </section>


        <!-- ========================= -->
        <!-- COMPOSER -->
        <!-- ========================= -->

        <div class="composer-area">


            <form
                id="composer"
                class="composer"
            >

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="8000"
                    placeholder="پیامت رو بنویس..."
                    autocomplete="off"
                ></textarea>


                <button
                    id="sendButton"
                    type="submit"
                    class="send-button"
                    aria-label="ارسال"
                >

                    ↑

                </button>

            </form>


            <div class="disclaimer">

                BEHRAD AI ممکن است اشتباه کند.
                اطلاعات مهم را بررسی کنید.

            </div>


        </div>

    </main>

</div>


<div
    id="mobileOverlay"
    class="mobile-overlay"
></div>


<div
    id="toast"
    class="toast"
></div>


<script
    src="/static/app.js"
></script>

</body>

  </html>
